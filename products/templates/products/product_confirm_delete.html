<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удалить товар</title>
</head>
<body>

<h2>Удалить товар</h2>

<p>Вы уверены, что хотите удалить товар <strong>{{ product.name }}</strong>?</p>

<form method="post">

    <a href="/">Отмена</a>
</form>

</body>
</html>
