<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удалить заказ</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .confirm-box { border: 1px solid #ccc; padding: 15px; width: 300px; text-align: center; margin-top: 20px;}
        .confirm-box button { margin-right: 10px; padding: 5px 10px; cursor: pointer; background-color: red; color: white; border: none; }
        .cancel-link { text-decoration: none; padding: 5px 10px; border: 1px solid blue; }
    </style>
</head>
<body>
    <h1>Удалить заказ</h1>
    <div class="confirm-box">
        <p>Вы уверены, что хотите удалить заказ №<strong>{{ order.order_number }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Удалить</button>
            <a href="{% url 'order_list' %}" class="cancel-link">Отмена</a>
        </form>
    </div>
</body>
</html>
